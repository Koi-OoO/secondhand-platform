[project]
name = "ai-service"
version = "0.1.0"
description = "Read-only AI marketplace query service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.2,<3.0",
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
