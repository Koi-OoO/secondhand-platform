openapi: 3.1.0
info:
  title: AI Marketplace Agent Internal API
  version: 0.1.0
  description: |
    Read-only product query contract between the Java backend and ai-service.
    The current product table has no product-level campus_id, so phase one does
    not filter products by campus; product cards expose tradeLocation instead.
servers:
  - url: http://localhost:8000
paths:
  /internal/agent/chat:
    post:
      operationId: chatWithMarketplaceAgent
      summary: Query marketplace products with the AI agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          description: Agent answer and matching product cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'
        '400':
          description: Invalid request
        '502':
          description: Java upstream or model dependency failure
components:
  schemas:
    AgentChatRequest:
      type: object
      required: [conversationId, message, userContext, traceId]
      properties:
        conversationId:
          type: string
          description: Stable conversation identifier supplied by Java.
        message:
          type: string
          minLength: 1
        userContext:
          $ref: '#/components/schemas/UserContext'
        traceId:
          type: string
          description: Correlation identifier propagated across Java and Python.
    UserContext:
      type: object
      required: [userId, campus, role]
      properties:
        userId:
          type: integer
          format: int64
        campus:
          type: string
        role:
          type: string
    AgentChatResponse:
      type: object
      required: [answer, items, traceId]
      properties:
        answer:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
        traceId:
          type: string
    ProductCard:
      type: object
      required: [productId, title, price, stock, conditionLevel, tradeLocation, detailPath]
      properties:
        productId:
          type: integer
          format: int64
        title:
          type: string
        price:
          type: number
          format: double
        stock:
          type: integer
          format: int32
        conditionLevel:
          type: integer
          format: int32
        tradeLocation:
          type: string
          description: Trade location shown to the user; no product campus filter in phase one.
        detailPath:
          type: string
    JavaResult:
      type: object
      description: Unified Java backend envelope returned by upstream APIs.
      required: [code, message, data]
      properties:
        code:
          type: integer
          description: 200 for success; other values indicate a business error.
        message:
          type: string
        data:
          description: Endpoint-specific payload, such as product list or detail.
