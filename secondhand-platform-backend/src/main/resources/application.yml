# Web 服务端口
server:
  port: 8080

spring:
  # 可选的本地敏感配置文件
  config:
    import: optional:classpath:application-local.yml

  # MySQL 数据库
  datasource:
    url: jdbc:mysql://localhost:3306/secondhand?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis：缓存、验证码和分布式 Session
  redis:
    host: localhost
    port: 6379
    database: 2

  # Spring Session 持久化配置
  session:
    store-type: redis
    timeout: 7d
    redis:
      namespace: secondhand:session

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  # JSON 时间格式
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

  # SMTP 邮件配置，用于发送密码找回验证码
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:true}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# OpenAPI 接口文档
springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.secondhand.controller

# 应用自定义配置
app:
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_TOKEN:dev-ai-internal-token}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:30000}
  search:
    canal:
      # Java 到 Canal 的连接；Canal 到 MySQL 的账号在 Docker 本地 env 中配置。
      enabled: ${PRODUCT_SEARCH_CANAL_ENABLED:false}
      host: ${PRODUCT_SEARCH_CANAL_HOST:127.0.0.1}
      port: ${PRODUCT_SEARCH_CANAL_PORT:11111}
      destination: ${PRODUCT_SEARCH_CANAL_DESTINATION:campus}
      schema: ${PRODUCT_SEARCH_CANAL_SCHEMA:secondhand}
      username: ${PRODUCT_SEARCH_CANAL_USERNAME:}
      password: ${PRODUCT_SEARCH_CANAL_PASSWORD:}
      batch-size: 100
      socket-timeout-millis: 10000
      retry-delay-millis: 5000
      idle-delay-millis: 500
    elasticsearch:
      # 商品广场使用 ES 搜索；初始化和增量同步步骤见 README-canal.md。
      enabled: ${PRODUCT_SEARCH_ES_ENABLED:false}
      # 仅初始化数据时显式开启；导入成功后关闭，避免每次重启全量扫描。
      import-on-startup: ${PRODUCT_SEARCH_ES_IMPORT_ON_STARTUP:false}
      url: ${PRODUCT_SEARCH_ES_URL:http://127.0.0.1:9200}
      index-name: ${PRODUCT_SEARCH_ES_INDEX:campus_products}
      connect-timeout-millis: ${PRODUCT_SEARCH_ES_CONNECT_TIMEOUT_MS:1000}
      socket-timeout-millis: ${PRODUCT_SEARCH_ES_SOCKET_TIMEOUT_MS:5000}
      username: ${PRODUCT_SEARCH_ES_USERNAME:}
      password: ${PRODUCT_SEARCH_ES_PASSWORD:}
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
  upload:
    local-path: ${APP_UPLOAD_LOCAL_PATH:uploads}
